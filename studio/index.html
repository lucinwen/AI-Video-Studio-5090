<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Studio · 本地创作</title>
<style>
:root{color-scheme:dark;--bg:#12131a;--surface:#1c1f2a;--line:#34394c;--ink:#f5f4ff;--muted:#b6b9cc;--accent:#cbc1ff;font:16px system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:1140px;margin:auto;padding:32px 22px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font-size:.8rem;letter-spacing:.13em;color:var(--accent)}h1{font-size:clamp(2rem,4vw,3.25rem);margin:.4em 0 .2em}h2{font-size:1.05rem;margin:0 0 16px}p,small{color:var(--muted);line-height:1.55}.tag{font-size:.8rem;padding:8px 12px;border:1px solid var(--line);border-radius:24px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(200px,1fr) 1.4fr 1fr;gap:16px;margin-top:24px}.panel{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}label{display:block;font-size:.85rem;margin:14px 0 6px}input,textarea,select,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;background:#151722;padding:9px;width:100%}textarea{min-height:82px;resize:vertical}button{cursor:pointer;margin-top:12px;background:var(--accent);color:#171329;font-weight:700}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}video{width:100%;margin-top:12px;border-radius:8px}small{display:block;margin-top:12px}a{color:var(--accent)}@media(max-width:800px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}}

:root{--bg:#101118;--surface:#181a25;--line:#30334a;--accent:#d4c5ff}
body{background:radial-gradient(ellipse at 50% 19%,#29213e 0,transparent 48%),var(--bg)}
.sitebar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.sitebar small{margin:0;font-weight:400}.hero{text-align:center;padding:66px 0 24px}.hero h1{line-height:1.1;font-size:clamp(2.5rem,6vw,5rem);letter-spacing:-.06em;margin:12px 0}
.hero p{margin:14px 0 0}.composer{margin:auto;max-width:760px;background:#191a25;border:1px solid #454160;border-radius:24px;padding:18px;box-shadow:0 14px 60px #0b09137a}
.composer textarea{min-height:118px;background:transparent;border:0;padding:12px;line-height:1.5}
.composer label{margin:0 0 6px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px}.actions button,.actions label{width:auto;margin:0;padding:9px 14px;border-radius:12px}.actions label{cursor:pointer;border:1px solid var(--line)}.actions input{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.actions input:focus-visible+label{outline:2px solid var(--accent)}.ref{display:flex;gap:10px;align-items:center;margin-top:10px}.ref[hidden]{display:none}.ref img{width:56px;height:56px;border-radius:9px;object-fit:cover}.ref button{width:auto;margin:0;background:transparent;color:var(--ink)}.state{min-height:22px;margin:12px 0 0;font-size:.86rem}.library{max-width:760px;margin:28px auto}.library summary{cursor:pointer}.library .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,175px),1fr))}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){.hero{padding:44px 0 18px}.composer{padding:14px}}
</style></head>
<body><main>
<div class="sitebar"><span>AI Video Studio</span><small>本地创作 · 开发预览</small></div>
<section class="hero" aria-labelledby="hero-title">
 <div class="eyebrow">VIDEO STUDIO</div><h1 id="hero-title">今天想拍什么？</h1>
 <p>描述你脑海里的画面，也可以从一张参考图开始。</p>
</section>
<form class="composer" id="quick-form">
 <label class="sr" for="idea">描述你想拍的画面</label><textarea id="idea" maxlength="2000" placeholder="例如：深夜的钥匙店里，暖黄灯光照着一把旧钥匙。镜头缓缓推近，门外飘着细雨。"></textarea>
 <div class="ref" id="ref-row" hidden><img id="ref-preview" alt="参考图预览"><small id="ref-name"></small><button id="remove-ref" type="button">移除</button></div>
 <div class="actions"><input type="file" id="reference" accept="image/png,image/jpeg,image/webp"><label for="reference">＋ 添加参考图</label><button>保存创作草稿</button></div>
 <p class="state" id="quick-status" role="status">前端预览：可保存文字草稿，参考图仅在本次预览；暂未接通本地视频生成。</p>
</form>
<details id="library" class="library"><summary>查看草稿和镜头库</summary><div class="grid">
<section class="panel"><h2>01 / 项目与镜头</h2><form id="project-form"><label for="name">新建项目</label><input id="name" required maxlength="80" placeholder="例如：一支短片"><button>创建项目</button></form><label for="project">当前项目</label><select id="project"></select><button type="button" id="add">添加镜头</button><label for="shot">当前镜头</label><select id="shot"></select></section>
<section class="panel"><h2>02 / 镜头卡</h2><form id="card"><fieldset id="fields" style="border:0;margin:0;padding:0;min-width:0"><label for="title">镜头标题</label><input id="title" maxlength="120" required><label for="change">希望生成什么</label><textarea id="change" maxlength="2000" placeholder="动作、表情、构图或镜头运动"></textarea><label for="keep">需要保留什么</label><textarea id="keep" maxlength="2000" placeholder="人物、服装、道具、光线或时长"></textarea><button>保存镜头卡</button></fieldset></form><small id="status" role="status" aria-live="polite"></small></section>
<section class="panel"><h2>03 / 候选预览</h2><p>先试审片流程：导入一段本机 MP4。这里不会触发生成，也不会上传素材。</p><label for="clip">选择本机 MP4</label><input id="clip" type="file" accept="video/mp4,.mp4"><video id="preview" controls playsinline hidden></video><a id="download" hidden>保存候选副本</a><small>只在当前页面预览；刷新后需重新导入。</small></section>
</div></details></main>
<script>
'use strict';
const by=id=>document.getElementById(id), key='creator-studio-v0';
let db={projects:[],project:0,shot:0}, clipUrl;
try{const old=JSON.parse(localStorage.getItem(key));if(old&&Array.isArray(old.projects))db=old;}catch{}
const project=()=>db.projects[db.project], shot=()=>project()?.shots[db.shot];
function save(message){try{localStorage.setItem(key,JSON.stringify(db));by('status').textContent=message;}catch{by('status').textContent='浏览器未允许保存；内容只在本次打开期间保留。';}}
function fill(id,items,index){const select=by(id);select.replaceChildren(...items.map((v,i)=>new Option(v,i)));select.selectedIndex=items.length?index:-1;select.disabled=!items.length;}
function render(){fill('project',db.projects.map(p=>p.name),db.project);fill('shot',(project()?.shots||[]).map(s=>s.title),db.shot);by('fields').disabled=!shot();by('add').disabled=!project();for(const id of ['title','change','keep'])by(id).value=shot()?.[id]||'';}
by('project-form').onsubmit=e=>{e.preventDefault();const name=by('name').value.trim();if(!name)return;db.projects.push({name,shots:[]});db.project=db.projects.length-1;db.shot=0;by('name').value='';render();save('项目已创建。');};
by('project').onchange=e=>{db.project=+e.target.value;db.shot=0;render();save('已切换项目。');};
by('shot').onchange=e=>{db.shot=+e.target.value;render();save('已切换镜头。');};
by('add').onclick=()=>{if(!project())return;const shots=project().shots;shots.push({title:'镜头 '+String(shots.length+1).padStart(2,'0'),change:'',keep:''});db.shot=shots.length-1;render();save('镜头已添加。');by('title').focus();};
by('card').onsubmit=e=>{e.preventDefault();if(!shot()||!by('title').value.trim())return;for(const id of ['title','change','keep'])shot()[id]=by(id).value.trim();render();save('镜头卡已保存。');};
by('clip').onchange=e=>{const file=e.target.files[0];const video=by('preview'),link=by('download');if(clipUrl)URL.revokeObjectURL(clipUrl);clipUrl=null;video.removeAttribute('src');video.load();link.removeAttribute('href');video.hidden=link.hidden=true;if(!file||!/\.mp4$/i.test(file.name))return;clipUrl=URL.createObjectURL(file);video.src=link.href=clipUrl;link.download=file.name;video.hidden=link.hidden=false;};
let refUrl=null;
const quickStatus=by('quick-status');
function clearRef(){if(refUrl)URL.revokeObjectURL(refUrl);refUrl=null;by('reference').value='';by('ref-preview').removeAttribute('src');by('ref-row').hidden=true;}
by('reference').onchange=e=>{const file=e.target.files[0];if(!file)return;clearRef();if(!['image/png','image/jpeg','image/webp'].includes(file.type)){quickStatus.textContent='请选择 PNG、JPEG 或 WebP 图片。';return;}refUrl=URL.createObjectURL(file);by('ref-preview').src=refUrl;by('ref-name').textContent=file.name;by('ref-row').hidden=false;quickStatus.textContent='图片仅供当前页面预览，不会上传或写入草稿。';};
by('remove-ref').onclick=clearRef;
by('quick-form').onsubmit=e=>{
 e.preventDefault();const idea=by('idea').value.trim();
 if(!idea){quickStatus.textContent=refUrl?'图片已预览。写一句希望它如何动，就能保存文字草稿。':'先描述一下你想拍的画面。';return;}
 let projectIndex=db.projects.findIndex(p=>p.quickDrafts===true);
 if(projectIndex<0){projectIndex=db.projects.length;db.projects.push({name:'快速创作',shots:[],quickDrafts:true});}
 db.project=projectIndex;
 const shots=project().shots;shots.push({title:idea.slice(0,36),change:idea,keep:''});db.shot=shots.length-1;
 render();
 try{localStorage.setItem(key,JSON.stringify(db));by('idea').value='';quickStatus.textContent=refUrl?'文字草稿已保存；参考图仍仅在本页预览。':'草稿已保存，可以在「草稿和镜头库」里继续。';}
 catch{quickStatus.textContent='浏览器未允许保存；草稿暂时只在本页镜头库里。';}
};
render();
</script></body></html>
